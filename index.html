<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A110C">
<meta name="description" content="La petite lumière qui reste allumée, là dès que tu en as besoin, le jour comme la nuit.">
<title>Ma veilleuse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma veilleuse">
<link rel="preload" href="polices/lexend.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/polices.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/verre.css">
</head>
<body>
<div class="decor" id="decor" aria-hidden="true"><div class="ciel"></div><div class="photo"></div><div class="sol"></div><div class="voile"></div></div>
<div class="lampe" aria-hidden="true"></div>
<div class="app">
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" aria-label="Sections"><div class="pan">
    <a href="#aujourdhui" data-tab="aujourdhui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17.5h18M7 17.5a5 5 0 0 1 10 0M12 8V6M5.8 11 4.4 9.6M18.2 11l1.4-1.4"/></svg><span>Aujourd’hui</span></a>
    <a href="#relais" data-tab="relais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v6a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V15A2.5 2.5 0 0 1 5 12.5z"/></svg><span>Relais</span></a>
    <button type="button" class="veille" data-action="veilleuse" aria-label="La lumière : de l'aide, tout de suite"><span class="orb" aria-hidden="true"><i class="onde"></i><i class="onde o2"></i></span></button>
    <a href="#maintenant" data-tab="maintenant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="m6.4 6.4 3.3 3.3M14.3 14.3l3.3 3.3M17.6 6.4l-3.3 3.3M9.7 14.3l-3.3 3.3"/></svg><span>Maintenant</span></a>
    <a href="#reperes" data-tab="reperes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m15 9-1.7 4.3L9 15l1.7-4.3z"/></svg><span>Repères</span></a>
  </div></nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-body"></div>
</div>
<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-label="Écran à montrer">
  <div class="show-inner" id="show-body" tabindex="-1"></div>
  <div class="show-actions" id="show-actions"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button type="button" class="coach" id="coach" data-action="coach-ok" hidden>Besoin d’aide, là, tout de suite ? Touche la lumière.</button>
<script src="js/app.js"></script>
</body>
</html>
